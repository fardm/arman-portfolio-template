<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>پنل مدیریت محتوا</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Tahoma, Arial, sans-serif; background: #0b111b; color: #f5f7fa; line-height: 1.8; }
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { background: #111a27; border-left: 1px solid #263243; padding: 24px 16px; }
.sidebar h1 { font-size: 1.1rem; margin-bottom: 24px; color: #b8f542; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; color: #9ba6b5; cursor: pointer; margin-bottom: 4px; border: none; background: none; width: 100%; text-align: right; font: inherit; }
.nav-item:hover, .nav-item.active { background: #172231; color: #f5f7fa; }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-group { margin-bottom: 4px; }
.nav-group-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 8px; color: #9ba6b5; cursor: pointer; border: none; background: none; width: 100%; text-align: right; font: inherit; }
.nav-group-toggle:hover { background: #172231; color: #f5f7fa; }
.nav-group-toggle .nav-group-label { display: flex; align-items: center; gap: 8px; }
.nav-group-toggle svg { width: 16px; height: 16px; flex-shrink: 0; transform: rotateZ(180deg);}
.nav-group-arrow { width: 14px; height: 14px; transition: transform 0.2s; flex-shrink: 0; }
.nav-group.open .nav-group-arrow { transform: rotate(90deg); }
.nav-group-children { display: none; padding-right: 28px; }
.nav-group.open .nav-group-children { display: block; }
.nav-child { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; color: #9ba6b5; cursor: pointer; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: right; font: inherit; font-size: .9rem; }
.nav-child:hover, .nav-child.active { background: #172231; color: #f5f7fa; }
.main { padding: 32px 48px; max-width: 1400px; min-width: 1250px; margin: 0 auto; overflow-x: hidden; }
.main h2 { font-size: 1.8rem; margin-bottom: 8px; }
.main p.sub { color: #9ba6b5; margin-bottom: 24px; }
.card { background: #111a27; border: 1px solid #263243; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
label { display: block; margin: 12px 0 4px; color: #9ba6b5; font-size: .85rem; }
input, select, textarea { width: 100%; background: #0b111b; border: 1px solid #263243; color: #f5f7fa; border-radius: 8px; padding: 10px 12px; font: inherit; }
textarea { min-height: 120px; resize: vertical; }
.btn { background: #b8f542; color: #0b111b; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 700; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { opacity: .9; }
.btn.sec { background: transparent; color: #f5f7fa; border: 1px solid #263243; }
.btn.danger { background: #ef4444; color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.github { background: #333; color: #fff; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
.list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #263243; border-radius: 8px; margin-bottom: 8px; }
.tag { background: #17303b; color: #8adcf0; border-radius: 999px; padding: 2px 10px; font-size: .78rem; }
.msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
.msg.ok { background: #15231b; border: 1px solid #b8f542; color: #b8f542; }
.msg.err { background: #2a1515; border: 1px solid #ef4444; color: #ef4444; }
img.preview { max-width: 100px; max-height: 100px; border-radius: 8px; border: 1px solid #263243; }
hr { border: none; border-top: 1px solid #263243; margin: 16px 0; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-content { background: #111a27; padding: 24px; border-radius: 12px; width: 90%; max-width: 800px; max-height: 80vh; overflow-y: auto; border: 1px solid #263243; }
.modal-close { display: block; margin-bottom: 12px; background: none; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; }
.lightbox-img { max-width: 90%; max-height: 90vh; border-radius: 8px; border: 1px solid #263243; object-fit: contain; }
@media (max-width: 768px) { .app { grid-template-columns: 1fr; } .sidebar { border-left: none; border-bottom: 1px solid #263243; } .grid2 { grid-template-columns: 1fr; } }
</style></head><body><div class="app">
<aside class="sidebar"><h1>پنل مدیریت</h1>
<div class="nav-group open" id="group-pages">
  <button class="nav-group-toggle" onclick="toggleGroup('pages')">
    <span class="nav-group-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg> برگه‌ها</span>
    <svg class="nav-group-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div class="nav-group-children">
    <button class="nav-child active" id="nav-hero" onclick="show('hero')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg> صفحه اصلی</button>
    <button class="nav-child" id="nav-resume" onclick="show('resume')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> رزومه</button>
  </div>
</div>
<button class="nav-item" onclick="show('projects')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> پروژه‌ها</button>
<button class="nav-item" onclick="show('categories')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/></svg> دسته‌ها</button>
<button class="nav-item" onclick="show('media')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> رسانه</button>
<div class="nav-group" id="group-settings">
  <button class="nav-group-toggle" onclick="toggleGroup('settings')">
    <span class="nav-group-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> تنظیمات</span>
    <svg class="nav-group-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div class="nav-group-children">
    <button class="nav-child" id="nav-settings" onclick="show('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l6.3-6.3a1 1 0 0 0 0-1.41L12 2z"/><circle cx="7" cy="7" r="1.5"/></svg> عمومی</button>
    <button class="nav-child" id="nav-theme" onclick="show('theme')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2a10 10 0 0 0 0 20 2.5 2.5 0 0 0 0-5 2.5 2.5 0 0 1 0-5h2.5a5 5 0 0 0 0-10z"/></svg> پوسته</button>
    <button class="nav-child" id="nav-font" onclick="show('font')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg> فونت</button>
  </div>
</div>
<hr>
<button class="nav-item" onclick="openPreview()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> پیش‌نمایش</button>
<button class="nav-item" onclick="show('publish')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg> انتشار</button>
</aside>
<main class="main"><div id="content"></div></main>
</div>
<script src="/app.js"></script></body></html>
